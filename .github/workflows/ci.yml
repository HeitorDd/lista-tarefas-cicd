# CI: roda em todo pull request e tambem e chamado pelo pipeline antes do deploy.
# Nao acessa a AWS.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes (pytest)
        run: pytest -v

  seguranca:
    name: Seguranca do codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vulnerabilidades nas bibliotecas (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Senhas e chaves esquecidas no codigo (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (sem enviar)
        run: docker build -t lista-tarefas:ci .

      - name: Teste rapido do conteiner
        run: |
          docker run -d --name app -p 8000:8000 lista-tarefas:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
